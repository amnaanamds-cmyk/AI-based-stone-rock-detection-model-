name: tests
on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "macOS" ]; then pip install torch; else pip install torch --index-url https://download.pytorch.org/whl/cpu; fi
          pip install -e ".[dev]"
      - name: Unit, integration and acceptance tests
        run: pytest -q
      - name: Installation self-check
        run: rockmap doctor --offline --data ci-data
      - name: Server smoke test
        run: |
          rockmap quickstart --no-serve --data ci-data
          rockmap serve --data ci-data --port 5055 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5055/healthz && break; sleep 2; done
          curl -sf http://127.0.0.1:5055/healthz | grep '"status":"ok"'
          curl -sf http://127.0.0.1:5055/login | grep -q "Sign in"
          curl -sf http://127.0.0.1:5055/static/vendor/leaflet/leaflet.js > /dev/null
          rockmap backup --data ci-data --out ci-backup.zip
          cat server.log | tail -5

  launcher:
    name: one-command launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: run.bat (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run.bat --no-serve --data ci-demo
          .venv\Scripts\rockmap doctor --offline --data ci-demo --port 5999
      - name: run.sh (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ./run.sh --no-serve --data ci-demo
          .venv/bin/rockmap doctor --offline --data ci-demo --port 5999
