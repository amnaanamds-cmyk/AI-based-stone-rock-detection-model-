[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rockmap"
version = "2.3.0"
description = "AI-Based Satellite Rock/Stone Detection and Geological Mapping System"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Aleena" }, { name = "Amna" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "rasterio>=1.4",
  "torch>=2.1",
  "flask>=3.0",
  "pillow>=10.0",
  "matplotlib>=3.7",
  "joblib>=1.3",
  "waitress>=3.0",
]

[project.optional-dependencies]
vector = ["fiona>=1.9"]
dev = ["pytest>=7"]

[project.scripts]
rockmap = "rockmap.cli:main"

[tool.setuptools.packages.find]
include = ["rockmap*"]

[tool.setuptools.package-data]
rockmap = ["web/templates/*.html", "web/static/*", "web/static/vendor/leaflet/*", "web/static/vendor/leaflet/images/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
